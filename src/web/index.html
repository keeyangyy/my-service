<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my-service 控制台</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">M</span>
      <h1 class="title">my-service <span class="title-sub">控制台</span></h1>
    </div>
    <div class="conn">
      <span class="conn-dot" id="conn-dot"></span>
      <span class="conn-text" id="conn-text">— 服务</span>
      <span class="host-uptime" id="host-uptime" title="my-service 自身运行时长">宿主 —</span>
      <span class="conn-sep" aria-hidden="true"></span>
      <button class="btn-host btn-host-restart" id="btn-host-restart" title="重启 my-service（会重启全部被管服务）">⟳ 重启宿主</button>
      <button class="btn-host btn-host-stop" id="btn-host-stop" title="停止 my-service（会停止全部被管服务）">■ 停止宿主</button>
      <button class="btn-refresh" id="btn-refresh" title="刷新" aria-label="刷新">↻</button>
      <span class="conn-badge" id="conn-badge" hidden>连接断开</span>
    </div>
  </header>

  <main class="app-main">
    <div id="empty-state" class="empty-state" hidden>
      尚无服务 —— 在 C:\path\to\&lt;名字&gt;\ 放一份 manifest.json 即可注册
    </div>
    <div id="service-list" class="service-list"></div>
  </main>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
</body>
</html>
