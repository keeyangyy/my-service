name: 功能建议
description: 希望 my-service 支持的新能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先描述场景，方案可以留空；涉及注册条字段变更的，请在「影响范围」里勾选。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你现在怎么做的、哪里别扭
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么做
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 面板交互
        - label: 注册条字段（涉及兼容性）
        - label: 新增接口或配置项
        - label: 不确定

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
