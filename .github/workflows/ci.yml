name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 单元测试
        run: python -m unittest discover -s tests -q

      - name: 隐私检查
        run: pwsh -NoProfile -File ./tools/check_privacy.ps1

      - name: 前端语法
        run: node --check web/app.js
