name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装检查工具
        # ruff 规则集随版本变化，钉住版本保证本地与 CI 判据一致
        run: python -m pip install --disable-pip-version-check ruff==0.17.5 coverage

      # 复杂度规则（C901/PLR）待 lint_05~07 拆解完成后启用，届时去掉 --select
      - name: 静态检查
        run: ruff check src tests --select E,F,W,B,UP,SIM

      - name: 单元测试与覆盖率
        run: |
          coverage run -m unittest discover -s tests -q
          coverage report --fail-under=70

      - name: 前端语法
        run: node --check web/app.js
