<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my-service 控制台</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="logo">M</span>
      <h1 class="title">my-service <span class="title-sub">控制台</span> <span class="ver-tag" id="ver-tag" hidden></span></h1>
    </div>
    <div class="conn">
      <span class="conn-dot" id="conn-dot"></span>
      <span class="conn-text" id="conn-text">— 服务</span>
      <span class="host-uptime" id="host-uptime" title="my-service 自身运行时长">宿主 —</span>
      <span class="conn-sep" aria-hidden="true"></span>
      <label class="host-switch" id="host-autostart-wrap" title="开机自启（启动文件夹 .lnk）">
        <input type="checkbox" id="host-autostart-toggle">
        <span class="host-switch-track" aria-hidden="true"><span class="host-switch-thumb"></span></span>
        <span class="host-switch-text">自启</span>
      </label>
      <button class="btn-host" id="btn-check-update" title="检查更新（便携包：下载后自动重启生效）">⟳ 更新</button>
      <button class="btn-host" id="btn-global-settings" title="编排器设置（面板刷新 / monitor / 定时任务检查间隔）">⚙ 设置</button>
      <button class="btn-host btn-host-audit" id="btn-host-audit" title="查看 my-service 启停登记簿（host.jsonl）">▤ 登记簿</button>
      <button class="btn-host btn-host-restart" id="btn-host-restart" title="重启 my-service（被管服务不受影响，继续运行）">⟳ 重启</button>
      <button class="btn-host btn-host-stop" id="btn-host-stop" title="停止 my-service（被管服务不受影响，继续运行）">■ 停止</button>
      <button class="btn-refresh" id="btn-refresh" title="刷新" aria-label="刷新">↻</button>
      <span class="conn-badge" id="conn-badge" hidden>连接断开</span>
    </div>
  </header>

  <main class="app-main">
    <div id="audit-drawer" class="audit-drawer" hidden></div>
    <div id="empty-state" class="empty-state" hidden>
      尚无服务 —— 在 reg\services\ 放一份 &lt;名字&gt;.json 即可注册
    </div>
    <!-- 服务按 mode 分两组：常驻（managed）与即用即走（on_demand）。
         分组纯展示，由前端按 snapshot 的 mode 推导，注册条无需任何新字段；
         某组为空时整组（含标题）隐藏。 -->
    <section id="svc-persistent" class="svc-section" hidden>
      <h2 class="section-title">🗄 常驻服务 <span class="svc-count" id="cntPd">0</span>
        <span class="section-sub">managed —— 起来就长期运行</span></h2>
      <div id="service-list" class="service-list"></div>
    </section>
    <section id="svc-ondemand" class="svc-section" hidden>
      <h2 class="section-title">⚡ 即用即走 <span class="svc-count" id="cntOd">0</span>
        <span class="section-sub">on_demand —— 点开即启，超时回收</span></h2>
      <div id="service-list-ondemand" class="service-list"></div>
    </section>
    <section id="cron-section" class="cron-section" hidden>
      <h2 class="section-title">⏱ 定时任务 <span class="section-sub">task —— 到点跑一次脚本，无常驻进程</span></h2>
      <div id="cron-list" class="cron-list"></div>
    </section>
  </main>

  <div id="settings-modal" class="settings-modal" hidden>
    <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <h3 id="settings-title">⚙ 编排器设置</h3>
      <label>事件保留天数（0 = 永不清理）<input id="set-audit" type="number" min="0" step="1"></label>
      <label>备份保留份数（0 = 不自动清理）<input id="set-backup-keep" type="number" min="0" step="1" placeholder="7"></label>
      <div class="settings-backup">
        <button id="set-backup" type="button">立即备份</button>
        <span id="backup-info" class="settings-hint">—</span>
      </div>

      <details class="settings-advanced">
        <summary>高级设置</summary>
        <p class="settings-hint" id="set-conn">监听：—</p>
        <label>面板可见时刷新（秒）<input id="set-fast" type="number" min="0.2" step="0.2"></label>
        <label>面板隐藏时刷新（秒）<input id="set-idle" type="number" min="1" step="1"></label>
        <label>面板活跃宽限（秒）<input id="set-grace" type="number" min="1" step="1"></label>
        <label>定时任务检查间隔（秒）<input id="set-tick" type="number" min="1" step="1"></label>
        <label class="settings-check"><input type="checkbox" id="set-cors-local"> 仅本机网页可跨源访问</label>
        <label>CORS 额外放行（逗号分隔）<input id="set-cors-allow" type="text" placeholder="主机名 / IP / CIDR"></label>
        <label>更新源代理（逗号分隔，留空 = 只用官方）<input id="set-mirrors" type="text"></label>
        <p class="settings-hint" id="set-regdir">注册目录：—</p>
      </details>

      <div class="settings-actions">
        <button id="set-cancel" type="button">取消</button>
        <button id="set-save" type="button" class="primary">保存</button>
      </div>
      <p class="settings-hint">保存后立即生效；监听地址/端口与注册目录需改 config.json 并重启。</p>
    </div>
  </div>

  <div id="update-modal" class="settings-modal" hidden>
    <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="update-title">
      <h3 id="update-title">发现新版本</h3>
      <p class="update-line" id="update-version">—</p>
      <p class="update-line" id="update-size">—</p>
      <pre class="update-notes" id="update-notes"></pre>
      <p class="settings-hint" id="update-source">—</p>
      <div class="settings-actions">
        <button id="update-cancel" type="button">稍后</button>
        <button id="update-confirm" type="button" class="primary">下载并更新</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
</body>
</html>
