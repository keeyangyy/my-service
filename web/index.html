<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my-service 服务管理面板</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="title-row">
      <h1 class="app-title">my-service</h1>
      <span id="conn-badge" class="conn-badge" hidden>连接断开</span>
    </div>
    <p class="app-subtitle">http://127.0.0.1:1236</p>
  </header>

  <main class="app-main">
    <div id="empty-state" class="empty-state" hidden>
      尚无服务——把带 manifest.json 的文件夹放进 C:\path\to 即可
    </div>
    <div id="service-list" class="service-list"></div>
  </main>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
</body>
</html>
